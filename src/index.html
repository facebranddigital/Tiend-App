<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <!-- CSP DEFINITIVO: Desbloquea Firebase Auth, Google Maps y Web Workers en desarrollo -->
    <meta
      http-equiv="Content-Security-Policy"
      content="script-src 'self' 'unsafe-eval' 'wasm-unsafe-eval' blob: https://*.jsdelivr.net https://cdn.jsdelivr.net https://*.google.com https://*.googleapis.com https://*.firebaseapp.com; script-src-elem 'self' 'unsafe-eval' blob: https://*.jsdelivr.net https://cdn.jsdelivr.net https://*.google.com https://*.googleapis.com https://*.firebaseapp.com; worker-src 'self' blob:; img-src 'self' data: https://*.googleapis.com https://*.gstatic.com; frame-src 'self' https://*.firebaseapp.com https://*.google.com;"
    />

    <title>Bracasfood</title>
    <base href="/" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/png" href="assets/bracasfoodlogo.jpeg" />

    <meta name="theme-color" content="#ff6b00" />
    <!-- Barra naranja en el cel -->
    <link rel="apple-touch-icon" href="icons/icon-192x192.png" />
    <!-- Icono para iPhone -->

    <!-- Mantenemos solo SweetAlert2 para las alertas bonitas de confirmación -->
    <script src="https://jsdelivr.net/npm/sweetalert2@11"></script>

    <link rel="preload" as="image" href="assets/hero.webp" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- El logo que sale en la pantalla naranja -->
    <link rel="preload" as="image" href="assets/bracasfoodlogo.jpeg" />
  </head>
  <body>
        <app-root>
      <div
        style="
          position: fixed;
          top: 0;
          left: 0;
          width: 100vw;
          height: 100vh;
          background-color: #ff6b00;
          display: flex;
          flex-direction: column;
          align-items: center;
          justify-content: center;
          z-index: 99999;
          font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        "
      >
        <!-- Contenedor relativo para superponer el spinner alrededor del logo -->
        <div style="position: relative; width: 160px; height: 160px; display: flex; align-items: center; justify-content: center;">
          <!-- Anillo de carga giratorio envolvente -->
          <div
            style="
              position: absolute;
              top: 0;
              left: 0;
              width: 160px;
              height: 160px;
              border: 4px solid rgba(255, 255, 255, 0.2);
              border-top: 4px solid #ffffff;
              border-radius: 50%;
              animation: spin 1s linear infinite;
            "
          ></div>

          <!-- Tu Logo centrado dentro del anillo -->
          <img
            src="assets/bracasfoodlogo.jpeg"
            style="
              width: 130px;
              height: 130px;
              border-radius: 50%;
              object-fit: cover;
              box-shadow: 0 10px 20px rgba(0, 0, 0, 0.3);
              animation: pulse 1.5s infinite ease-in-out;
            "
            alt="Cargando Bracasfood..."
          />
        </div>

        <!-- Texto de carga -->
        <div
          style="
            margin-top: 25px;
            color: #ffffff;
            font-size: 16px;
            font-weight: 600;
            letter-spacing: 1px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
          "
        >
          Cargando Bracasfood...
        </div>
      </div>

      <style>
        @keyframes spin {
          0% { transform: rotate(0deg); }
          100% { transform: rotate(360deg); }
        }
        @keyframes pulse {
          0%, 100% { transform: scale(1); }
          50% { transform: scale(1.05); }
        }
      </style>
    </app-root>
    <noscript>Please enable JavaScript to continue using this application.</noscript>
  </body>
</html>
