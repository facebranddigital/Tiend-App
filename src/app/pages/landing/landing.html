<div class="hero-container">
  <!-- 🎥 Vídeo de fondo en pantalla completa -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="assets/videobracas.mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
  </video>

  <!-- Capa de contenido por encima del vídeo (Logo centrado) -->
  <div class="hero-content-overlay">
    <div class="logo-link">
      <img src="assets/bracasfoodlogo.jpeg" alt="Bracasfood Logo" class="hero-img">
    </div>
  </div>
</div>

<!-- 🛍️ Catálogo interactivo con filteredProducts() corregido -->
<div class="product-grid">
  <div class="product-card" *ngFor="let producto of filteredProducts()">
    <div class="product-image-container">
      <img [src]="producto.image" [alt]="producto.name">
    </div>
    <div class="product-info">
      <h3>{{ producto.name }}</h3>
      <p class="price">{{ producto.price | currency:'COP':'symbol':'1.0-0' }}</p>
      
      <!-- Selector de cantidad -->
      <div class="qty-mini">
        <button type="button" (click)="cambiarCantidadLocal(producto, -1)">-</button>
        <input type="number" [value]="producto.quantity || 1" min="1" readonly>
        <button type="button" (click)="cambiarCantidadLocal(producto, 1)">+</button>
      </div>

      <button class="add-btn" (click)="onAddToCart(producto.name, producto.price, producto.category, producto.image, producto.quantity || 1)">COMPRAR</button>
    </div>
  </div>
</div>
