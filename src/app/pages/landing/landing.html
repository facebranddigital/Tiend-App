<div class="hero-container">
  <!-- 🎥 Vídeo de fondo en pantalla completa -->
  <video autoplay muted loop playsinline class="bg-video">
    <source src="assets/videobracas.mp4" type="video/mp4">
    Tu navegador no soporta videos HTML5.
  </video>

  <!-- Capa de contenido por encima del vídeo (Logo centrado) -->
  <div class="hero-content-overlay">
    <div class="logo-link">
      <img src="assets/bracasfoodlogo.jpeg" alt="Bracasfood Logo" class="hero-img">
    </div>
  </div>
</div>

<!-- 🛍️ Carrusel horizontal de productos con la propiedad exacta -->
<div class="product-grid">
  <div class="product-card" *ngFor="let producto of products">
    <div class="product-image-container">
      <img [src]="producto.image" [alt]="producto.name">
    </div>
    <div class="product-info">
      <h3>{{ producto.name }}</h3>
      <p class="price">{{ producto.price | currency }}</p>
      
      <!-- Selector de cantidad compacto (- 1 +) -->
      <div class="qty-mini">
        <button type="button">-</button>
        <input type="number" value="1" min="1" readonly>
        <button type="button">+</button>
      </div>

      <button class="add-btn">COMPRAR</button>
    </div>
  </div>
</div>
