<div [class.perfil-ever]="esPerfilEver">
  
  <div class="categorias-container">
    <div class="header-categorias">
      <h1>{{ tituloPrincipal }}</h1> 
    </div>

    <div class="categorias-grid">
      <!-- SECCIÓN NARIÑO / VIDEOS -->
      <div 
        class="categoria-card card-tradicion" 
        [ngStyle]="{'background-image': 'url(' + fondoNarino + ')'}"
        (click)="filtrarPor('tradicion')">
        <div class="overlay">
          <h2>{{ tituloNarino }}</h2>
          <p>{{ descNarino }}</p>
          <button class="btn-ver">{{ textoBotonNarino }}</button> 
        </div>
      </div>

      <!-- SECCIÓN SNACKS / FOTOS -->
      <div 
        class="categoria-card card-snacks" 
        [ngStyle]="{'background-image': 'url(' + fondoSnacks + ')'}"
        (click)="filtrarPor('snacks')">
        <div class="overlay">
          <h2>{{ tituloSnacks }}</h2>
          <p>{{ descSnacks }}</p>
          <button class="btn-ver">{{ textoBotonSnacks }}</button> 
        </div>
      </div>
    </div>
  </div>

  <!-- 🎬 MODAL FLOTANTE: REPRODUCTOR DE VIDEO -->
  <div class="video-modal-overlay" *ngIf="mostrarModalVideo" (click)="cerrarVideo()">
    <div class="video-modal-content" (click)="$event.stopPropagation()">
      <button class="btn-cerrar-modal" (click)="cerrarVideo()">✕</button>
      <video controls autoplay class="reproductor-ever">
        <source [src]="rutaVideoEver" type="video/mp4">
        Tu navegador no soporta la reproducción de este video.
      </video>
    </div>
  </div>

  <!-- 🖼️ MODAL FLOTANTE: VISUALIZADOR DE FOTO -->
  <div class="foto-modal-overlay" *ngIf="mostrarModalFoto" (click)="cerrarFoto()">
    <div class="foto-modal-content" (click)="$event.stopPropagation()">
      <button class="btn-cerrar-modal" (click)="cerrarFoto()">✕</button>
      <img [src]="rutaFotoEver" alt="Registro Fotográfico" class="visor-foto-ever">
    </div>
  </div>

</div>
